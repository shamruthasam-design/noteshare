<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account - NoteShare</title>

  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
        color: white;
    }

    .register-box {
        width: 420px;
        padding: 40px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(15px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .logo {
        text-align: center;
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .logo span {
        color: #a78bfa;
    }

    .subtitle {
        text-align: center;
        color: #cbd5e1;
        margin-bottom: 30px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #e2e8f0;
    }

    input {
        width: 100%;
        padding: 13px;
        margin-bottom: 20px;
        border: 1px solid #475569;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.7);
        color: white;
        outline: none;
        font-size: 15px;
    }

    input:focus {
        border-color: #8b5cf6;
    }

    .register-btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #8b5cf6;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    .register-btn:hover {
        background: #7c3aed;
    }

    .login {
        text-align: center;
        margin-top: 25px;
        color: #cbd5e1;
    }

    .login a {
        color: #a78bfa;
        text-decoration: none;
    }

    .back {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #94a3b8;
        text-decoration: none;
    }
  </style>
</head>

<body>

<div class="register-box">

  <div class="logo">
    Note<span>Share</span>
  </div>

  <p class="subtitle">
    Create your student account
  </p>

  <form id="registerForm">

    <label for="name">Name</label>

    <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required>


    <label for="email">Email</label>

    <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required>


    <label for="password">Password</label>

    <input
            type="password"
            id="password"
            placeholder="Create a password"
            required>


    <button
            type="submit"
            class="register-btn">

      Create Account

    </button>

  </form>


  <div class="login">

    Already have an account?

    <a href="/login.html">
      Login
    </a>

  </div>


  <a class="back" href="/">
    ← Back to Home
  </a>

</div>


<script>

  document.getElementById("registerForm").addEventListener("submit", async function(event) {

      event.preventDefault();

      const student = {
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value
      };

      try {

          const response = await fetch("/api/students", {
              method: "POST",
              headers: {
                  "Content-Type": "application/json"
              },
              body: JSON.stringify(student)
          });

          if (response.ok) {

              alert("Account created successfully!");

              window.location.href = "/login.html";

          } else {

              alert("Registration failed. Email may already exist.");

          }

      } catch (error) {

          alert("Server connection failed.");

      }

  });

</script>

</body>

</html>
